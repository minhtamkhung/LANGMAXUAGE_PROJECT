# =============================================================
# application.yml — TOEIC Flashcard App
# Giá trị nhạy cảm đọc từ environment variable (${VAR_NAME})
# Local dev: tạo file application-dev.yml và override ở đó
# =============================================================

spring:
  application:
    name: toeic-flashcard

  profiles:
    active: dev   # đổi thành 'prod' khi deploy

  # ── PostgreSQL ──────────────────────────────────────────────
  jpa:
    hibernate:
      # [IMPORTANT] Dùng 'validate' — Flyway quản lý schema migration.
      # 'update' nguy hiểm trong production: Hibernate có thể tự ALTER TABLE,
      # dẫn đến mất data nếu rename column.
      # Dev profile ghi đè về 'update' để tiện phát triển nhanh.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

  # ── Email (Spring Mail) ─────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your_email@gmail.com}
    password: ${MAIL_PASSWORD:your_app_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

  # ── Redis ───────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # để trống nếu local không có password

  # ── File upload ─────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# ── App config ────────────────────────────────────────────────
app:

  # ── JWT ─────────────────────────────────────────────────────
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-min-32-chars}
    access-token-expiration-ms: 900000        # 15 phút
    refresh-token-expiration-ms: 604800000    # 7 ngày

  # ── Cloudinary ──────────────────────────────────────────────
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:your_cloud_name}
    api-key: ${CLOUDINARY_API_KEY:your_api_key}
    api-secret: ${CLOUDINARY_API_SECRET:your_api_secret}
    folder: toeic-flashcard   # tất cả ảnh upload vào folder này

  # ── CORS ────────────────────────────────────────────────────
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}  # Vite dev server

  # ── OTP ─────────────────────────────────────────────────────
  otp:
    ttl-minutes: 5          # OTP hết hạn sau 5 phút

  # ── Google OAuth2 ────────────────────────────────────────────
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    gemini:
      api-key: ${GEMINI_API_KEY:your-gemini-api-key}

  # ── Rate Limiting (chống brute-force OTP) ────────────────────
  # Cấu hình này bảo vệ hai luồng:
  #   1. Brute-force OTP: chặn sau otpMaxAttempts lần nhập sai
  #   2. Email bombing:   giới hạn sendOtpMaxPerHour lần gửi OTP / email / giờ
  rate-limit:
    otp-max-attempts: 5       # Số lần nhập OTP sai tối đa trước khi bị khoá
    send-otp-max-per-hour: 3  # Số lần yêu cầu gửi OTP tối đa trong 1 giờ

  # ── Security (trusted reverse proxy) ─────────────────────────
  # Danh sách IP của reverse proxy tin cậy (nginx, load balancer, v.v.).
  # Chỉ chấp nhận header X-Forwarded-For khi request đến từ các IP này.
  # Để trống nếu app chạy trực tiếp không qua proxy.
  # Ví dụ khi deploy với Docker: TRUSTED_PROXIES=172.18.0.2
  security:
    trusted-proxies: ${TRUSTED_PROXIES:}
