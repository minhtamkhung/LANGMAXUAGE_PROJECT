spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/langmaxuage_db
    username: postgres
    password: postgres

  data:
    redis:
      host: redis
      port: 6379

  jpa:
    # Linh hoạt bật/tắt log SQL trong container qua biến môi trường (mặc định tắt)
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
